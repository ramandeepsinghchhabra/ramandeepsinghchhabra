name: Update contribution animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ramandeepsinghchhabra
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B18CFF&color_dots=#74638B,#74638B,#8D70B1,#AF8ADD,#D8C6F5
            dist/github-contribution-grid-snake-dark.svg?color_snake=#D9C3FF&color_dots=#4B3C60,#66517F,#8565AC,#B18CFF,#E6D8FF
      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
